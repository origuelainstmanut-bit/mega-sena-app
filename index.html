<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mega-Sena Estatística</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>

    body{
      margin:0;
      padding:18px;
      font-family:Arial, sans-serif;
      background:#064e3b;
      color:white;
    }

    .container{
      max-width:520px;
      margin:auto;
    }

    h1{
      text-align:center;
      color:#00ff88;
      font-size:30px;
      margin-bottom:20px;
    }

    .card{
      background:#047857;
      padding:18px;
      border-radius:18px;
      box-shadow:0 0 15px rgba(0,0,0,0.3);
    }

    label{
      display:block;
      margin-top:15px;
      font-size:17px;
      font-weight:bold;
    }

    select,
    input,
    button{
      width:100%;
      padding:14px;
      margin-top:8px;
      font-size:17px;
      border-radius:12px;
      border:none;
      box-sizing:border-box;
    }

    input,
    select{
      background:white;
      color:black;
    }

    button{
      background:#10b981;
      color:white;
      font-weight:bold;
      margin-top:18px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.02);
    }

    .pdf{
      background:#f59e0b;
    }

    .resultado{
      margin-top:22px;
      background:#022c22;
      padding:15px;
      border-radius:12px;
      font-size:16px;
      white-space:pre-wrap;
      line-height:1.6;
      border:1px solid #00ff88;
    }

    .info{
      margin-top:15px;
      font-size:13px;
      color:#d1fae5;
      text-align:center;
    }

    .lgpd{
      margin-top:12px;
      font-size:12px;
      color:#ecfdf5;
      line-height:1.5;
      background:#065f46;
      padding:10px;
      border-radius:10px;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>🎰 Mega-Sena Estatística</h1>

  <div class="card">

    <label>Nome do apostador opcional</label>

    <input
      type="text"
      id="nomeApostador"
      placeholder="Digite o nome, se desejar"
    >

    <label>CPF opcional</label>

    <input
      type="text"
      id="cpfApostador"
      placeholder="Digite o CPF, se desejar"
    >

    <div class="lgpd">
      Os dados informados são usados apenas
      para aparecer no PDF gerado no próprio dispositivo.
      O app não salva nem envia essas informações.
    </div>

    <label>Quantidade de dezenas por jogo</label>

    <select id="dezenas">
      <option>6</option>
      <option>7</option>
      <option>8</option>
      <option>9</option>
      <option>10</option>
      <option>11</option>
      <option>12</option>
      <option>13</option>
      <option>14</option>
      <option>15</option>
    </select>

    <label>Quantidade de jogos</label>

    <input
      type="number"
      id="qtdJogos"
      value="10"
      min="1"
    >

    <button onclick="gerarJogos()">
      🎲 Gerar Jogos Inteligentes
    </button>

    <button
      class="pdf"
      onclick="baixarPDF()"
    >
      📄 Baixar PDF
    </button>

    <div
      class="resultado"
      id="resultado"
    >
Os jogos aparecerão aqui...
    </div>

  </div>

  <div class="info">
    © 2026 Flavio Henrique Origuela Meira.
    Todos os direitos reservados.
  </div>

</div>

<script>

let jogosPDF = [];

function combinacao(n, k){

  if(k > n) return 0;

  let resultado = 1;

  for(let i = 1; i <= k; i++){

    resultado =
      resultado * (n - i + 1) / i;

  }

  return Math.round(resultado);

}

function gerarJogo(qtdDezenas){

  let numeros = [];

  while(numeros.length < qtdDezenas){

    let numero =
      Math.floor(Math.random() * 60) + 1;

    if(!numeros.includes(numero)){

      numeros.push(numero);

    }

  }

  return numeros.sort((a,b)=>a-b);

}

function analisarJogo(jogo){

  let pares =
    jogo.filter(n => n % 2 === 0).length;

  let impares =
    jogo.length - pares;

  let soma =
    jogo.reduce((a,b)=>a+b,0);

  let faixas = [

    jogo.filter(n => n >=1 && n <=10).length,
    jogo.filter(n => n >=11 && n <=20).length,
    jogo.filter(n => n >=21 && n <=30).length,
    jogo.filter(n => n >=31 && n <=40).length,
    jogo.filter(n => n >=41 && n <=50).length,
    jogo.filter(n => n >=51 && n <=60).length

  ];

  let maiorSequencia = 1;
  let seqAtual = 1;

  for(let i = 1; i < jogo.length; i++){

    if(jogo[i] === jogo[i-1] + 1){

      seqAtual++;

      maiorSequencia =
        Math.max(maiorSequencia, seqAtual);

    }else{

      seqAtual = 1;

    }

  }

  return {
    pares,
    impares,
    soma,
    faixas,
    maiorSequencia
  };

}

function validarJogo(jogo){

  let analise =
    analisarJogo(jogo);

  let qtd =
    jogo.length;

  if(qtd === 6 &&
    (analise.pares < 2 ||
     analise.pares > 4))
     return false;

  let somaMin =
    qtd * 18;

  let somaMax =
    qtd * 42;

  if(analise.soma < somaMin ||
     analise.soma > somaMax)
     return false;

  if(Math.max(...analise.faixas)
    >= Math.ceil(qtd / 2) + 1)
    return false;

  if(analise.maiorSequencia >= 4)
    return false;

  return true;

}

function probabilidadeMega(qtdDezenas){

  let favoraveis =
    combinacao(qtdDezenas, 6);

  let total =
    combinacao(60, 6);

  return {

    favoraveis,
    total,
    chance: total / favoraveis

  };

}

function gerarJogos(){

  let qtdDezenas =
    parseInt(
      document.getElementById("dezenas").value
    );

  let qtdJogos =
    parseInt(
      document.getElementById("qtdJogos").value
    );

  let jogos = [];

  let tentativas = 0;

  while(jogos.length < qtdJogos &&
        tentativas < qtdJogos * 10000){

    let jogo =
      gerarJogo(qtdDezenas);

    tentativas++;

    let chave =
      jogo.join("-");

    if(
      validarJogo(jogo) &&
      !jogos.some(j => j.join("-") === chave)
    ){

      jogos.push(jogo);

    }

  }

  jogosPDF = jogos;

  let texto = "";

  jogos.forEach((jogo,index)=>{

    let analise =
      analisarJogo(jogo);

    let dezenas =
      jogo.map(n =>
        String(n).padStart(2,"0")
      ).join(" - ");

    texto +=
`Jogo ${index+1}
${dezenas}

Pares: ${analise.pares}
Ímpares: ${analise.impares}
Soma: ${analise.soma}

`;

  });

  let prob =
    probabilidadeMega(qtdDezenas);

  texto +=
`ANÁLISE PROBABILÍSTICA

Chance aproximada:
1 em ${Math.round(prob.chance).toLocaleString("pt-BR")}

Combinações:
${prob.favoraveis}

`;

  document
    .getElementById("resultado")
    .textContent = texto;

}

function baixarPDF(){

  if(jogosPDF.length === 0){

    alert("Gere os jogos primeiro.");

    return;

  }

  const { jsPDF } = window.jspdf;

  const doc = new jsPDF();

  let nome =
    document
      .getElementById("nomeApostador")
      .value;

  let cpf =
    document
      .getElementById("cpfApostador")
      .value;

  let data =
    new Date()
      .toLocaleString("pt-BR");

  doc.setFillColor(6,78,59);

  doc.rect(0,0,210,297,"F");

  doc.setTextColor(0,255,136);

  doc.setFontSize(22);

  doc.text(
    "MEGA-SENA ESTATÍSTICA",
    105,
    20,
    {align:"center"}
  );

  doc.setTextColor(255,255,255);

  doc.setFontSize(10);

  doc.text(
    `Data: ${data}`,
    105,
    30,
    {align:"center"}
  );

  let y = 45;

  doc.text(
    `Apostador: ${nome || "_________________"}`,
    12,
    y
  );

  y += 8;

  doc.text(
    `CPF: ${cpf || "_________________"}`,
    12,
    y
  );

  y += 15;

  jogosPDF.forEach((jogo,index)=>{

    if(y > 250){

      doc.addPage();

      doc.setFillColor(6,78,59);

      doc.rect(0,0,210,297,"F");

      y = 20;

    }

    doc.setFillColor(4,120,87);

    doc.roundedRect(
      12,
      y-8,
      186,
      26,
      4,
      4,
      "F"
    );

    doc.setTextColor(0,255,136);

    doc.setFontSize(13);

    doc.text(
      `Jogo ${index+1}`,
      18,
      y
    );

    y += 10;

    let x = 18;

    jogo.forEach(numero=>{

      doc.setFillColor(16,185,129);

      doc.circle(x+4,y-2,4.5,"F");

      doc.setTextColor(0,0,0);

      doc.setFontSize(9);

      doc.text(
        String(numero).padStart(2,"0"),
        x+4,
        y+1,
        {align:"center"}
      );

      x += 15;

    });

    y += 18;

  });

  doc.setTextColor(255,255,255);

  doc.setFontSize(8);

  doc.text(
    "Os filtros estatísticos não garantem premiação.",
    12,
    280
  );

  doc.text(
    "© 2026 Flavio Henrique Origuela Meira",
    105,
    288,
    {align:"center"}
  );

  doc.save(
    "mega_sena_estatistica.pdf"
  );

}

</script>

</body>
</html>
