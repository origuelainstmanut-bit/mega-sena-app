<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador Mega-Sena</title>
</head>
<body>
  <h1>Gerador Mega-Sena</h1>

  <label>Quantidade de dezenas:</label>
  <select id="dezenas">
    <option>6</option>
    <option>7</option>
    <option>8</option>
    <option>9</option>
    <option>10</option>
    <option>11</option>
    <option>12</option>
    <option>13</option>
    <option>14</option>
    <option>15</option>
  </select>

  <br><br>

  <label>Quantidade de jogos:</label>
  <input type="number" id="qtdJogos" value="10">

  <br><br>

  <button onclick="gerarJogos()">Gerar Jogos</button>

  <h2>Jogos Gerados</h2>
  <pre id="resultado"></pre>

  <script>
    function gerarJogo(qtdDezenas) {
      let numeros = [];

      while (numeros.length < qtdDezenas) {
        let n = Math.floor(Math.random() * 60) + 1;

        if (!numeros.includes(n)) {
          numeros.push(n);
        }
      }

      numeros.sort((a, b) => a - b);
      return numeros;
    }

    function gerarJogos() {
      let qtdDezenas = parseInt(document.getElementById("dezenas").value);
      let qtdJogos = parseInt(document.getElementById("qtdJogos").value);
      let resultado = "";

      for (let i = 1; i <= qtdJogos; i++) {
        let jogo = gerarJogo(qtdDezenas);
        let texto = jogo.map(n => String(n).padStart(2, "0")).join(" - ");
        resultado += "Jogo " + i + ": " + texto + "\n";
      }

      document.getElementById("resultado").textContent = resultado;
    }
  </script>
</body>
</html>
